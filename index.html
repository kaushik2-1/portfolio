<style>
@property --span{syntax:'<length>';inherits:true;initial-value:0px}
:root{--bg1:#0a2630;--bg2:#0f4250;--ink:#E9F1F4;--muted:#A9BCC4;--ease:cubic-bezier(.55,0,.25,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100svh;display:flex;flex-direction:column;color:var(--ink);font:400 16px/1.55 "Source Sans 3",system-ui,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));overflow-x:hidden}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
a{color:inherit}
:focus-visible{outline:3px solid #FFD23F;outline-offset:3px}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;gap:16px;position:relative;z-index:900}
.brand{font:700 1.3rem "Bricolage Grotesque",sans-serif;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
nav{display:flex;gap:6px}
nav button{font:600 15px "Source Sans 3",sans-serif;color:#dff0f5;background:none;border:0;padding:8px 12px;border-radius:99px;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.1)}
.mail{font:700 1rem "Bricolage Grotesque",sans-serif;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}.sel{user-select:all}
.stage{position:relative;flex:1;min-height:560px;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px}
.word{position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);text-align:center;font:700 clamp(90px,19vw,300px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;color:rgba(255,255,255,.07);pointer-events:none;user-select:none}
.meta{position:absolute;left:48px;bottom:18px;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.meta b{color:#FFD23F;font-weight:600}
.pill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:13px;white-space:nowrap}
.rail{position:absolute;left:0;right:0;top:10px;height:16px;background:linear-gradient(#fff,#b9c4cb);box-shadow:0 6px 14px rgba(0,0,0,.3)}
.claw{position:absolute;top:0;width:0;transition-property:left;transition-timing-function:var(--ease);z-index:800}
.car{position:absolute;left:-30px;top:6px;width:60px;height:26px;border-radius:8px;background:linear-gradient(#fff,#cfd8de);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.drop{position:absolute;left:0;top:32px;width:0;transition-property:height;transition-timing-function:var(--ease)}
.rod{position:absolute;left:-4px;width:8px;top:0;bottom:0;background:linear-gradient(90deg,#8e9aa3,#fff,#8e9aa3)}
.head{position:absolute;left:-34px;top:100%;width:68px;height:26px;border-radius:8px;background:linear-gradient(#fff,#cfd8de);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.grip{position:absolute;top:calc(100% + 26px);left:0;width:0;transition-property:--span;transition-timing-function:var(--ease)}
.arm{position:absolute;left:calc(var(--span)/-2);width:var(--span);top:-7px;height:7px;background:#e8eef1;border-radius:3px}
.f{position:absolute;top:-7px;width:9px;height:46px;border-radius:3px 3px 5px 5px;background:linear-gradient(90deg,#fff,#c4cfd6);transform-origin:50% 0;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.f.l{left:calc(var(--span)/-2 - 4px)}.f.r{left:calc(var(--span)/2 - 5px)}
.grip.open .f.l{transform:rotate(16deg)}.grip.open .f.r{transform:rotate(-16deg)}
.chip{position:absolute;perspective:900px;border-radius:12px;background:var(--c);box-shadow:0 14px 26px rgba(0,0,0,.4);transition-property:left,top,width,height,transform;transition-timing-function:var(--ease)}
.chip::before,.chip::after{content:"";position:absolute;top:14%;bottom:14%;width:8px;background:repeating-linear-gradient(180deg,#cdd6dc 0 6px,transparent 6px 12px);border-radius:2px}
.chip::before{left:-8px}.chip::after{right:-8px}
.doors{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;container-type:inline-size;color:#fff;transition:transform .2s}
.doors:hover{transform:translateY(-8px)}
.chip.open .doors{visibility:hidden;transition:visibility 0s .8s;pointer-events:none}
.door{position:absolute;top:0;width:50%;height:100%;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(0,0,0,.18)),var(--c);transition:transform .75s cubic-bezier(.3,1.3,.5,1),opacity .6s}
.door.l{left:0;border-radius:12px 0 0 12px;transform-origin:0 50%}
.door.r{right:0;border-radius:0 12px 12px 0;transform-origin:100% 50%;border-left:1px solid rgba(0,0,0,.25)}
.chip.open .door.l{transform:rotateY(-105deg);opacity:0}
.chip.open .door.r{transform:rotateY(105deg);opacity:0}
.door span{display:block;width:200%;padding:9cqw;font:700 15cqw/.9 "Bricolage Grotesque",sans-serif;text-align:left}
.door.r span{margin-left:-100%}
.door.r i{position:absolute;right:6cqw;bottom:5cqw;font:600 5.5cqw "Source Sans 3",sans-serif;font-style:normal;letter-spacing:.12em;opacity:.85}
.dot{position:absolute;left:5cqw;bottom:5cqw;width:5cqw;height:5cqw;border-radius:50%;background:rgba(0,0,0,.28)}
.panel{position:absolute;inset:8px;border-radius:8px;background:#0b1d26;padding:clamp(16px,3vw,32px);overflow:auto;opacity:0;transition:opacity .5s .15s}
.chip.open .panel{opacity:1}
.panel h2{font-size:clamp(1.7rem,4vw,2.6rem);margin:4px 0 14px;font-weight:700}
.panel h2 em{font:italic 400 1.1em "Instrument Serif",serif;color:var(--c)}
.k{margin:0;font-weight:600;color:var(--c)}
.panel p{margin:0 0 12px;max-width:62ch;color:#cfdde3}
.hi{display:flex;gap:18px;align-items:center}
.hi img{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:50% 25%;border:3px solid var(--c);flex:none}
.item{padding:12px 0;border-top:1px solid #243b46}
.item h3{font-size:1.1rem;margin-bottom:2px}
.item p{margin:0;font-size:.97rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tags span{background:#17313d;border:1px solid #2a4a58;padding:3px 12px;border-radius:99px;font-size:.95rem}
.btn{border:0;font:600 1rem "Source Sans 3",sans-serif;cursor:pointer;display:inline-block;margin:4px 8px 8px 0;padding:10px 20px;border-radius:99px;background:var(--c);color:#06161c;font-weight:600;text-decoration:none}
@media (max-width:700px){header{height:auto;flex-wrap:wrap;padding:10px 14px;justify-content:space-between}nav{order:3;width:100%;justify-content:center;flex-wrap:wrap}.meta,.pill{display:none}.rail+.x{}}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important}}
</style>

{c:'#18a88f',l:'HELLO',t:'U1',n:'Hello',h:`<div class="hi"><img src="${PH}" alt="Rajnish Kaushik"><div><p class="k">Hello</p><h2 tabindex="-1">Hi, I’m <em>Rajnish.</em></h2></div></div><p>I’m a B.Tech computer science student who likes turning data into working tools. I build machine learning models and connect them to simple backends so they work in real time.</p><p>I write C++ and Python, I’m familiar with Java, and I’ve solved 100+ problems on LeetCode. Pick any chip on the board to see more.</p>`},

const PD=[[.50,.62,-5],[.20,.76,7],[.80,.74,-8],[.35,.88,4],[.65,.89,-4],[.88,.56,9]];
const PM=[[.50,.58,-5],[.27,.72,7],[.75,.72,-8],[.25,.87,4],[.52,.84,-4],[.80,.88,9]];
const st=document.getElementById('stage'),claw=document.getElementById('claw'),drop=document.getElementById('drop'),grip=document.getElementById('grip');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,K=RM?0:1,H0=58,LT=104;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let sw,sh,held=null,busy=false,pending=null;
const chips=D.map((d,i)=>{const e=document.createElement('div');e.className='chip';e.style.setProperty('--c',d.c);
e.innerHTML=`<div class="panel" inert>${d.h}</div><button class="doors" aria-label="Open ${d.n}"><span class="door l"><span>${d.l}</span><b class="dot"></b></span><span class="door r"><span>${d.l}</span><i>${d.t}</i></span></button>`;
e.querySelector('.doors').onclick=()=>req(i);st.appendChild(e);return e});
function meas(){const r=st.getBoundingClientRect();sw=r.width;sh=r.height}
function pile(i){const m=sw<=700,p=(m?PM:PD)[i],w=m?Math.min(150,sw*.38):Math.min(230,Math.max(150,sw*.17)),h=w*.74;return{x:p[0]*sw,top:p[1]*sh-h/2,w,h,r:p[2]}}
function lift(){const m=sw<=700,w=Math.min(sw-28,720),h=m?sh-LT-20:Math.min(sh-LT-60,470);return{x:sw/2,top:LT,w,h,r:0}}
function put(e,g,ms){const s=e.style;s.transitionDuration=ms+'ms';s.left=g.x+'px';s.top=g.top+'px';s.width=g.w+'px';s.height=g.h+'px';s.transform=`translateX(-50%) rotate(${g.r}deg)`}
function move(x,L,w,ms){claw.style.transitionDuration=ms+'ms';drop.style.transitionDuration=ms+'ms';grip.style.transitionDuration=ms+'ms';claw.style.left=x+'px';drop.style.height=L+'px';grip.style.setProperty('--span',(w+22)+'px')}
const z=i=>Math.round(pile(i).top);
function layout(){meas();chips.forEach((e,i)=>{const g=held===i?lift():pile(i);put(e,g,0);e.style.zIndex=held===i?500:z(i)});
const g=held==null?{x:sw/2,top:LT,w:120}:lift();const p=held==null?null:g;
move(g.x,g.top-H0,held==null?100:g.w,0);if(held==null)drop.style.height='46px'}
async function run(i){
if(held!=null){const h=held,e=chips[h];e.classList.remove('open');e.querySelector('.panel').inert=true;await sleep(450*K);
const p=pile(h);put(e,p,850*K);move(p.x,p.top-H0,p.w,850*K);await sleep(850*K);e.style.zIndex=z(h);grip.classList.add('open');held=null;await sleep(200*K)}
const e=chips[i],p=pile(i);grip.classList.add('open');
move(p.x,24,p.w,750*K);await sleep(750*K);
move(p.x,p.top-H0,p.w,560*K);await sleep(560*K);
grip.classList.remove('open');put(e,{...p,r:0},240*K);await sleep(240*K);
const g=lift();e.style.zIndex=500;put(e,g,950*K);move(g.x,g.top-H0,g.w,950*K);await sleep(950*K);
held=i;e.classList.add('open');const pn=e.querySelector('.panel');pn.inert=false;pn.tabIndex=0;await sleep(750*K);
const hd=pn.querySelector('h2');if(hd)hd.focus({preventScroll:true})}
async function loop(){busy=true;while(pending!==null){const i=pending;pending=null;if(i!==held)await run(i)}busy=false}
function req(i){pending=i;if(!busy)loop()}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>req(+b.dataset.go));
addEventListener('keydown',e=>{if(e.key==='Escape')req(0)});
addEventListener('resize',layout);
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const t=b.dataset.copy,o=b.textContent;const ok=()=>{b.textContent='Copied';setTimeout(()=>b.textContent=o,1500)};const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(_){}a.remove()};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(_){fb()}});
meas();layout();setTimeout(()=>req(0),500);
</script>
